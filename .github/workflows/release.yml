name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            out: yabgu-linux-x86_64
            cc: gcc
            flags: -O2 -s -static -Wall -Wextra
          - os: windows-latest
            target: windows-x86_64
            out: yabgu-windows-x86_64.exe
            cc: gcc
            flags: -O2 -s -Wall -Wextra

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: bash
        run: ${{ matrix.cc }} ${{ matrix.flags }} -o "${{ matrix.out }}" yabgu.c

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: ${{ matrix.out }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*